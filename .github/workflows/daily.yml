name: stackly-daily-reel
on:
  schedule:
    - cron: "0 4 * * *"          # ~06:00 Europe/Paris (CEST). Hiver: ~05:00 (GitHub = UTC, pas de DST).
  workflow_dispatch: {}           # bouton "Run workflow" pour tester a la demande
permissions:
  contents: write
concurrency:
  group: daily-reel
  cancel-in-progress: false
jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Deps systeme (ffmpeg + Poppins)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          sudo mkdir -p /usr/share/fonts/truetype/google-fonts
          for f in Poppins-Bold Poppins-Medium Poppins-Regular Poppins-Light; do
            sudo curl -sL -o /usr/share/fonts/truetype/google-fonts/$f.ttf \
              "https://github.com/google/fonts/raw/main/ofl/poppins/$f.ttf"
          done
          fc-cache -f >/dev/null 2>&1 || true
      - name: Deps python
        run: pip install -r requirements.txt
      - name: Generer le Reel du jour
        id: gen
        run: python cloud_run.py
      - name: Commit etat + video
        if: steps.gen.outputs.slug != ''
        run: |
          git config user.name "stackly-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add out state
          git commit -m "reel: ${{ steps.gen.outputs.slug }}" || echo "rien a committer"
          git push
      - name: Notifier le telephone (ntfy)
        if: steps.gen.outputs.slug != ''
        run: |
          SLUG="${{ steps.gen.outputs.slug }}"
          RAW="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/out/Reel_${SLUG}.mp4"
          curl -s \
            -H "X-Title: Reel pret a poster" \
            -H "X-Message: $(cat caption.txt)" \
            -H "X-Attach: ${RAW}" \
            -H "X-Filename: Reel_${SLUG}.mp4" \
            "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"
